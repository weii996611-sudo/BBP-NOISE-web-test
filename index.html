    function formatCreatedAt(dateString) {
      if (!dateString) return "";
      const date = new Date(dateString);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function getAreaTitle(text) {
      const rawText = String(text || "").trim();

      const chineseChars = rawText.match(/[\u4e00-\u9fff]/g);

      if (chineseChars && chineseChars.length >= 4) {
        return chineseChars.slice(0, 4).join("");
      }

      return rawText.slice(0, 4) || "紀錄檔";
    }
    function getBodyTextWithoutArea(text) {
      const rawText = String(text || "").trim();

      let chineseCount = 0;
      let cutIndex = 0;

      for (let i = 0; i < rawText.length; i++) {
        if (/[\u4e00-\u9fff]/.test(rawText[i])) {
          chineseCount++;
        }

        if (chineseCount === 4) {
          cutIndex = i + 1;
          break;
        }
      }

      if (chineseCount >= 4) {
        return rawText.slice(cutIndex).trim();
      }

      return rawText;
    }
    function renderAreaFilterButtons(regionItems, activeArea) {
      const bar = document.getElementById("area-filter-bar");
      if (!bar) return;

      const areaList = [];
      const areaCountMap = {};

      regionItems.forEach(function (item) {
        const area = getAreaTitle(item.text);

        if (!area) return;

        if (!areaCountMap[area]) {
          areaCountMap[area] = 0;
          areaList.push(area);
        }

        areaCountMap[area]++;
      });

      if (areaList.length <= 1) {
        bar.innerHTML = "";
        bar.style.display = "none";
        return;
      }

      bar.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.className = "area-filter-btn" + (!activeArea ? " active" : "");
      allBtn.type = "button";
      allBtn.textContent = "全部";

      allBtn.addEventListener("click", function () {
        filterData(currentRegion, "");
      });

      bar.appendChild(allBtn);

      areaList.forEach(function (area) {
        const count = areaCountMap[area] || 0;
        const displayText = count > 1 ? area + count : area;

        const btn = document.createElement("button");
        btn.className = "area-filter-btn" + (activeArea === area ? " active" : "");
        btn.type = "button";
        btn.textContent = displayText;

        btn.addEventListener("click", function () {
          filterData(currentRegion, area);
        });

        bar.appendChild(btn);
      });

      bar.style.display = "flex";
    }

    async function loadDataFromServer(callback) {
      if (!supabaseClient) {
        allData = [];
        showError("資料庫連線失敗，請檢查系統參數。");
        return;
      }
      try {
        const { data, error } = await supabaseClient
          .from("noise_reports")
          .select("id, text, image_url, image_urls, region, report_logs, report_count, is_active, created_at")
          .eq("is_active", true)
          .order("created_at", { ascending: false });

        if (error) throw error;

        allData = (data || []).map(function (item) {
          return {
            id: item.id,
            text: item.text || "",
            imageUrl: item.image_url || "",
            imageUrls: Array.isArray(item.image_urls) && item.image_urls.length > 0
              ? item.image_urls
              : (item.image_url ? [item.image_url] : []),
            region: item.region || "",
            reportLogs: item.report_logs || "",
            reportCount: item.report_count || 0,
            isActive: item.is_active,
            createdAt: item.created_at || ""
          };
        });

        if (typeof callback === "function") callback();
      } catch (error) {
        allData = [];
        showError("系統異常：" + error.message);
      }
    }

    function createCardElement(item, cardNumber, regionName) {
      const card = document.createElement("div");

      const images = Array.isArray(item.imageUrls) && item.imageUrls.length > 0
        ? item.imageUrls
        : (item.imageUrl ? [item.imageUrl] : []);

      if (images.length > 0) {
        const imageContainer = document.createElement("div");
        imageContainer.className = "image-container";

        const img = document.createElement("img");
        let currentImageIndex = 0;

        img.src = images[currentImageIndex];
        img.alt = "系統快照";
        img.loading = "lazy";

        img.onerror = function () {
          imageContainer.style.display = "none";
        };

        imageContainer.appendChild(img);

        if (images.length > 1) {
          const leftBtn = document.createElement("button");
          leftBtn.className = "image-nav-btn left";
          leftBtn.type = "button";
          leftBtn.textContent = "‹";

          const rightBtn = document.createElement("button");
          rightBtn.className = "image-nav-btn right";
          rightBtn.type = "button";
          rightBtn.textContent = "›";

          const dots = document.createElement("div");
          dots.className = "image-dots";

          const dotElements = images.map(function (_, index) {
            const dot = document.createElement("span");
            dot.className = "image-dot" + (index === 0 ? " active" : "");
            dots.appendChild(dot);
            return dot;
          });

          function updateCarouselImage() {
            img.src = images[currentImageIndex];

            dotElements.forEach(function (dot, index) {
              dot.className = "image-dot" + (index === currentImageIndex ? " active" : "");
            });
          }

          function showPrevImage() {
            currentImageIndex =
              currentImageIndex === 0
                ? images.length - 1
                : currentImageIndex - 1;

            updateCarouselImage();
          }

          function showNextImage() {
            currentImageIndex =
              currentImageIndex === images.length - 1
                ? 0
                : currentImageIndex + 1;

            updateCarouselImage();
          }

          leftBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            showPrevImage();
          });

          rightBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            showNextImage();
          });

          let touchStartX = 0;
          let touchStartY = 0;
          let touchEndX = 0;
          let touchEndY = 0;

          imageContainer.addEventListener("touchstart", function (event) {
            if (!event.touches || event.touches.length === 0) return;

            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
          }, { passive: true });

          imageContainer.addEventListener("touchend", function (event) {
            if (!event.changedTouches || event.changedTouches.length === 0) return;

            touchEndX = event.changedTouches[0].clientX;
            touchEndY = event.changedTouches[0].clientY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) < 45 || Math.abs(diffX) < Math.abs(diffY)) {
              return;
            }

            if (diffX > 0) {
              showPrevImage();
            } else {
              showNextImage();
            }
          }, { passive: true });

          imageContainer.appendChild(leftBtn);
          imageContainer.appendChild(rightBtn);
          imageContainer.appendChild(dots);
        }

        card.appendChild(imageContainer);
      }

      const body = document.createElement("div");
      body.className = "bb-body";
      body.textContent = getBodyTextWithoutArea(item.text);
      card.appendChild(body);

      const meta = document.createElement("div");
      meta.className = "bb-meta";

      shareBtn.className = "share-card-btn";
      shareBtn.type = "button";
      shareBtn.innerHTML = '<img src="https://sadnhsddereuhpfvdquk.supabase.co/storage/v1/object/sign/BBP%20LOGO/share.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV8yNzI5Y2M5OC1mM2IzLTRhNGMtOTAzMC03M2M2MjZlNTM0NTIiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJCQlAgTE9HTy9zaGFyZS5wbmciLCJpYXQiOjE3Nzk0MTU2MTMsImV4cCI6MTg3NDAyMzYxM30.ZuWXLgK9ohxg-YDP12NXf1Bsvj-0zwrr_DMKPRgonis" class="btn-icon"> 分享貼文';
      shareBtn.addEventListener("click", function () { shareCard(shareBtn, regionName, item.id); });

      removeBtn.className = "remove-card-btn";

    async function reportWithdraw(buttonObj, reportId) {
      if (!supabaseClient) {
        buttonObj.textContent = "❌ 連線失敗";
        return;
      }

      const deviceId = getDeviceId();
      buttonObj.disabled = true;
      buttonObj.textContent = "⏳ 回報中...";

      try {
        const { data, error } = await supabaseClient.rpc("report_noise_withdraw", { p_report_id: reportId, p_device_id: deviceId });
        if (error) throw error;
        const result = data || {};

        if (result.status === "cooldown" || result.status === "updated") {
          buttonObj.textContent = "✓ 已送出通報";
          localStorage.setItem("bbp_noise_reported_" + reportId, String(Date.now()));
          return;
        }

        if (result.status === "deleted") {
          buttonObj.textContent = "✓ 狀況解除，下架中";
          localStorage.setItem("bbp_noise_reported_" + reportId, String(Date.now()));
          setTimeout(function () {
            const targetCardBox = document.getElementById("card-box-" + reportId);
            if (targetCardBox) {
              targetCardBox.classList.add("fade-out");
              setTimeout(async function () {
                await loadDataFromServer(function () { filterData(currentRegion); });
              }, 400);
            } else {
              refreshCurrentRegion();
            }
          }, 600);
          return;
        }

        if (result.status === "not_found") {
          buttonObj.textContent = "⚠️ 紀錄已不存在";
          setTimeout(function () { refreshCurrentRegion(); }, 1000);
          return;
        }

        buttonObj.textContent = "⚠️ 無效操作";
        setTimeout(function () {
          buttonObj.disabled = false;
          buttonObj.textContent = "🛑 設備已撤離";
        }, 2000);

      } catch (error) {
        buttonObj.textContent = "❌ 系統錯誤";
        setTimeout(function () {
          buttonObj.disabled = false;
          buttonObj.textContent = "🛑 設備已撤離";
        }, 2000);
      }
    }
    function enableDesktopHorizontalWheel() {
      const dataScreen = document.getElementById("data-screen");
      if (!dataScreen) return;

      let wheelLock = false;

      dataScreen.addEventListener("wheel", function (event) {
        if (window.innerWidth <= 768) return;

        const isVisible = window.getComputedStyle(dataScreen).display === "flex";
        if (!isVisible) return;

        const canScrollHorizontally = dataScreen.scrollWidth > dataScreen.clientWidth;
        if (!canScrollHorizontally) return;

        event.preventDefault();

        const delta = Math.abs(event.deltaY) > Math.abs(event.deltaX)
          ? event.deltaY
          : event.deltaX;

        if (wheelLock) return;

        wheelLock = true;

        dataScreen.scrollBy({
          left: delta * 2.2,
          behavior: "smooth"
        });

        setTimeout(function () {
          wheelLock = false;
        }, 90);
      }, { passive: false });
    }


    function setAdvertisingLink(anchor, url) {
      if (!anchor) return;
      const safeUrl = String(url || "").trim();
      if (safeUrl) {
        anchor.href = safeUrl;
        anchor.style.pointerEvents = "auto";
        anchor.setAttribute("aria-label", "開啟廣告連結");
      } else {
        anchor.removeAttribute("href");
        anchor.style.pointerEvents = "none";
        anchor.removeAttribute("aria-label");
      }
    }

    function initPopupAdvertisement() {
      const settings = AD_SETTINGS.popup || {};
      const modal = document.getElementById("marketing-ad-modal");
      const image = document.getElementById("marketing-ad-image");
      const link = document.getElementById("marketing-ad-link");
      const closeButton = document.getElementById("marketing-ad-close");
      const countdown = document.getElementById("marketing-ad-countdown");

      if (!settings.enabled || !settings.image || !modal || !image || !link || !closeButton || !countdown) {
        return;
      }

      const popupSessionKey = "bbp_marketing_popup_shown";

      if (settings.showOncePerBrowserSession) {
        try {
          if (sessionStorage.getItem(popupSessionKey) === "1") {
            return;
          }
        } catch (error) {
          console.warn("無法讀取彈窗廣告顯示紀錄：", error);
        }
      }

      image.src = settings.image;
      image.alt = settings.alt || "業主行銷海報廣告";
      setAdvertisingLink(link, settings.link);

      image.onerror = function () {
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
        console.warn("彈窗廣告圖片載入失敗：", settings.image);
      };

      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");
      closeButton.style.display = "none";

      if (settings.showOncePerBrowserSession) {
        try {
          sessionStorage.setItem(popupSessionKey, "1");
        } catch (error) {
          console.warn("無法儲存彈窗廣告顯示紀錄：", error);
        }
      }

      const delayMs = Math.max(0, Number(settings.closeDelayMs) || 5000);
      let remainingSeconds = Math.ceil(delayMs / 1000);
      countdown.textContent = remainingSeconds + " 秒後可關閉廣告";

      const countdownTimer = setInterval(function () {
        remainingSeconds -= 1;
        if (remainingSeconds > 0) {
          countdown.textContent = remainingSeconds + " 秒後可關閉廣告";
        }
      }, 1000);

      const unlockTimer = setTimeout(function () {
        clearInterval(countdownTimer);
        countdown.textContent = "點擊圖片可前往廣告頁面";
        closeButton.style.display = "block";
        closeButton.focus({ preventScroll: true });
      }, delayMs);

      closeButton.addEventListener("click", function closeAdvertisement() {
        clearInterval(countdownTimer);
        clearTimeout(unlockTimer);
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
      }, { once: true });
    }

    function initFooterAdvertisementCarousel() {
      const footerSettings = AD_SETTINGS.footer || {};
      const items = Array.isArray(footerSettings.items)
        ? footerSettings.items.filter(function (item) { return item && item.image; })
        : [];

      const carousel = document.getElementById("footer-ad-carousel");
      const image = document.getElementById("footer-ad-image");
      const link = document.getElementById("footer-ad-link");
      const prevButton = document.getElementById("footer-ad-prev");
      const nextButton = document.getElementById("footer-ad-next");
      const dotsContainer = document.getElementById("footer-ad-dots");

      if (!footerSettings.enabled || items.length === 0 || !carousel || !image || !link || !prevButton || !nextButton || !dotsContainer) {
        return;
      }

      let currentIndex = 0;
      let rotationTimer = null;
      let touchStartX = 0;
      let touchEndX = 0;

      function renderDots() {
        dotsContainer.innerHTML = "";
        items.forEach(function (_, index) {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "footer-ad-dot" + (index === currentIndex ? " active" : "");
          dot.setAttribute("aria-label", "切換至第 " + (index + 1) + " 則廣告");
          dot.addEventListener("click", function () {
            showItem(index);
            restartRotation();
          });
          dotsContainer.appendChild(dot);
        });
      }

      function showItem(index) {
        currentIndex = (index + items.length) % items.length;
        const item = items[currentIndex];

        image.classList.add("is-changing");
        setTimeout(function () {
          image.src = item.image;
          image.alt = item.alt || "合作廣告";
          setAdvertisingLink(link, item.link);
          image.classList.remove("is-changing");
          renderDots();
        }, 120);
      }

      function stopRotation() {
        if (rotationTimer) {
          clearInterval(rotationTimer);
          rotationTimer = null;
        }
      }

      function startRotation() {
        stopRotation();
        if (items.length <= 1) return;
        const intervalMs = Math.max(2000, Number(footerSettings.intervalMs) || 5000);
        rotationTimer = setInterval(function () {
          showItem(currentIndex + 1);
        }, intervalMs);
      }

      function restartRotation() {
        startRotation();
      }

      prevButton.addEventListener("click", function () {
        showItem(currentIndex - 1);
        restartRotation();
      });

      nextButton.addEventListener("click", function () {
        showItem(currentIndex + 1);
        restartRotation();
      });

      carousel.addEventListener("mouseenter", stopRotation);
      carousel.addEventListener("mouseleave", startRotation);
      carousel.addEventListener("focusin", stopRotation);
      carousel.addEventListener("focusout", startRotation);

      carousel.addEventListener("touchstart", function (event) {
        if (!event.touches || event.touches.length === 0) return;
        touchStartX = event.touches[0].clientX;
      }, { passive: true });

      carousel.addEventListener("touchend", function (event) {
        if (!event.changedTouches || event.changedTouches.length === 0) return;
        touchEndX = event.changedTouches[0].clientX;
        const difference = touchEndX - touchStartX;
        if (Math.abs(difference) < 45) return;
        showItem(difference > 0 ? currentIndex - 1 : currentIndex + 1);
        restartRotation();
      }, { passive: true });

      image.onerror = function () {
        console.warn("Footer 廣告圖片載入失敗：", image.src);
        if (items.length > 1) {
          showItem(currentIndex + 1);
        } else {
          carousel.style.display = "none";
        }
      };

      carousel.style.display = "block";
      prevButton.style.display = items.length > 1 ? "block" : "none";
      nextButton.style.display = items.length > 1 ? "block" : "none";
      dotsContainer.style.display = items.length > 1 ? "flex" : "none";
      showItem(0);
      startRotation();
    }

    function initAdvertising() {
      initFooterAdvertisementCarousel();
      initPopupAdvertisement();
    }

    window.addEventListener("load", initAdvertising);

    function scrollToCard(reportId) {
      const targetCard = document.getElementById("card-box-" + reportId);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }
  </script>
